# Render 一键部署配置（免费套餐）。带 sync: false 的变量要在 Render 网页上填，不会写进代码。
services:
  - type: web
    name: es-support-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn es_agent.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-flash
      - key: SHOP_BACKEND
        value: shopify
      - key: SHOPIFY_STORE_DOMAIN
        value: lumi-es-test.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: 2026-10
      - key: LLM_API_KEY
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
